run-name: ${{ github.actor }} is running Unit Tests
on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-test:
    strategy:
      matrix:
        php_version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mage-os/github-actions/unit-test@d27b0e883b655809e7399c8e5c831e1f6f503f3e # main, 2026-09-08
        with:
          php_version: ${{ matrix.php_version }}
          composer_auth: ${{ secrets.COMPOSER_AUTH }}
